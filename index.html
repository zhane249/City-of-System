<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="wide=device-width, initial scale=1.0">
        <title> Roaming at Night </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <img id="parkImage" src="steps/step1.jpeg" alt="Entering Park with Concret Pavement">

        <img id="footButton" src="feet/foot.png" alt="yellow footprints">

        <script>
         const images = [
            "steps/step1.jpeg",
             "steps/step2.jpeg",
            "steps/step3.jpeg",
            "steps/step4.jpeg",
            "steps/step5.jpeg",
            "steps/step6.jpeg",
            "steps/step7.jpeg",
             "steps/step8.jpeg",
              "steps/step9.jpeg",
               "steps/step10.jpeg"
        ];

        let currentStep = 0;
        const parkImage = document.getElementById("parkImage");
const footButton = document.getElementById("footButton");

footButton.addEventListener("click", ()=> {
    if(currentStep < images.length -1){
        currentStep++;
        parkImage.src = images[currentStep];
    }
});
            </script>
            </body>
            </html>
