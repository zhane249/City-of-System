<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Roaming at Night </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <img id="parkImage" src="steps/step1.jpeg" alt="Entering Park with Concret Pavement">

        <div id="handContainer"></div>

        <img id="footButton" src="feet/foot.png" alt="yellow footprints">

        <script>
         const images = [
            "steps/step1.jpeg",
             "steps/step2.jpeg",
            "steps/step3.jpeg",
            "steps/step4.jpeg",
            "steps/step5.jpeg",
            "steps/step6.jpeg",
            "steps/step7.jpeg",
             "steps/step8.jpeg",
              "steps/step9.jpeg",
               "steps/step10.jpeg"
        ];

        let currentStep = 0;
        const parkImage = document.getElementById("parkImage");
const footButton = document.getElementById("footButton");


const handContainer = document.getElementById("handContainer");

const handprints = [
"hands/blue.png", "hands/green.png", "hands/orange.png", "hands/purple.png"
        ];

        const handCount = [2, 3, 1, 2, 1, 4, 3, 2, 6, 2];



function showHandprints() {
    handContainer.innerHTML = "";

    for (let i = 0; i < handCount[currentStep]; i++) {
        let hand = document.createElement("img");

        hand.src = handprints[i % handprints.length];
        hand.className = "handprint";
        hand.draggable = false;

        // Starting positions
        hand.style.left = (20 + i * 20) + "%";
        hand.style.top = (30 + i * 10) + "%";
        hand.style.width = "100px";

        handContainer.appendChild(hand);

        // Dragging
        let dragging = false;

        hand.addEventListener("mousedown", (event) => {
            dragging = true;
            event.preventDefault();
        });

        document.addEventListener("mousemove", (event) => {
            if (dragging) {
                hand.style.left = event.clientX + "px";
                hand.style.top = event.clientY + "px";
            }
        });

        document.addEventListener("mouseup", () => {
            dragging = false;
        });
    }
}
 

footButton.addEventListener("click", ()=> {
    if(currentStep < images.length -1){
        currentStep++;
        parkImage.src = images[currentStep];

        showHandprints();
    }
});
showHandprints();
            </script>
            </body>
            </html>
